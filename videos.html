<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos &amp; Keynotes — GIET University Alumni</title>
  <meta name="description"
    content="Watch recorded alumni gala reunions, distinguished speaker keynotes, and campus tours from GIET University." />

  <!-- Google Fonts Preconnect & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/videos.css" />
</head>

<body>

  <div id="site-header-container"></div>

  <main class="main-content">
    <section class="vg-page-hero" id="videos-hero">
      <div class="container">
        <h1 class="vg-hero-heading">Alumni Video Gallery</h1>
        <p class="vg-hero-subtitle">Curated moments from landmark reunions, pioneering alumni, and the campus you love —
          all in one place.</p>
      </div>
    </section>

    <section class="section" style="padding-top: var(--space-8);">
      <div class="container">
        <!-- Category Filter Pills -->
        <div id="video-category-pills" class="category-filter-pills">
          <!-- Populated dynamically from js/pages/videos.js -->
        </div>

        <!-- Video Cards Grid -->
        <div id="videos-grid" class="videos-grid">
          <!-- Populated dynamically from js/pages/videos.js -->
        </div>
      </div>
    </section>

    <!-- Theater Mode Dialog Modal -->
    <div id="theater-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true"
      aria-labelledby="theater-video-title" tabindex="-1">
      <div class="modal-content theater-dialog">

        <!-- Accessible close button in top-right corner -->
        <button id="close-theater-modal" class="theater-close-btn" type="button" aria-label="Close video player">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <!-- 16:9 Video Player -->
        <div class="theater-player-wrap">
          <iframe id="theater-iframe" class="theater-iframe" src=""
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen title="Alumni video player"></iframe>
        </div>

        <!-- Video metadata below player -->
        <div class="theater-info">
          <span id="theater-video-cat" class="theater-cat-badge"></span>
          <h2 id="theater-video-title" class="theater-video-title">Video Title</h2>
          <p id="theater-video-desc" class="theater-video-desc">Video description goes here.</p>
        </div>

      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/pages/videos.js"></script>
</body>

</html>
