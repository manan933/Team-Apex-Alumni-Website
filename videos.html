<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos &amp; Keynotes — Apex University Alumni</title>
  <meta name="description"
    content="Watch recorded alumni gala reunions, distinguished speaker keynotes, and campus tours from Apex University." />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/videos.css" />
</head>

<body>

  <div id="site-header-container"></div>

  <main class="main-content">
    <section class="section-cream"
      style="padding-top: var(--space-12); padding-bottom: var(--space-10); border-bottom: 1px solid var(--color-border-warm);">
      <div class="container">
        <span class="section-tag">Multimedia Showcase</span>
        <h1
          style="font-family: var(--font-heading); font-size: clamp(2.25rem, 5vw, var(--text-5xl)); color: var(--color-primary); margin-bottom: var(--space-2);">
          Keynotes, Reunions &amp; Campus Life
        </h1>
        <p
          style="font-size: var(--text-lg); color: var(--color-text-secondary); max-width: 640px; line-height: var(--leading-normal);">
          Relive memorable alumni reunions, listen to inspirational talks by celebrated graduates, and explore campus
          developments.
        </p>
      </div>
    </section>

    <section class="section" style="padding-top: var(--space-8);">
      <div class="container">
        <!-- Category Filter Pills -->
        <div id="video-category-pills" class="category-filter-pills">
          <!-- Populated dynamically from js/pages/videos.js -->
        </div>

        <!-- Video Cards Grid -->
        <div id="videos-grid" class="videos-grid">
          <!-- Populated dynamically from js/pages/videos.js -->
        </div>
      </div>
    </section>

    <!-- Theater Mode Dialog Modal -->
    <div id="theater-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content theater-dialog">
        <div class="theater-player-wrap">
          <iframe id="theater-iframe" class="theater-iframe" src=""
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <div class="theater-info">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4);">
            <div>
              <h3 id="theater-video-title"
                style="margin-bottom: var(--space-1); font-family: var(--font-heading); font-size: var(--text-xl); color: var(--color-primary);">
                Video Title</h3>
              <p id="theater-video-desc"
                style="font-size: var(--text-sm); color: var(--color-text-secondary); margin-bottom: 0;">Video
                description goes here.</p>
            </div>
            <button id="close-theater-modal" class="btn btn-outline btn-sm" style="flex-shrink: 0;">Close
              Player</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer-container"></div>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/pages/videos.js"></script>
</body>

</html>
